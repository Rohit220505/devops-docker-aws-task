name: my-task

on: workflow_dispatch

jobs:
    first-job:
        runs-on: ubuntu-latest
        steps:
            - name: checkout code
              uses: actions/checkout@v3
            
            - name: Docker image build
              run: docker build -t devops-python-app .
            
            - name: Docker image verify
              run: docker images
            
            - name: Authenticate to AWS
              uses: aws-actions/configure-aws-credentials@v2
              with:
                aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                aws-region: ap-south-1
            
            - name: Push the image to ECR
              run: |
                aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin 961457613719.dkr.ecr.ap-south-1.amazonaws.com
                docker tag devops-python-app:latest 961457613719.dkr.ecr.ap-south-1.amazonaws.com/devops-python-app:latest
                docker images
                docker push 961457613719.dkr.ecr.ap-south-1.amazonaws.com/devops-python-app:latest


